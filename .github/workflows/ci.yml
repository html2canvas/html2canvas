name: CI

on:
    push:
        branches: [master]
        tags:
            - 'v*'
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest
        name: Build
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Cache node modules
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-
            - name: Npm install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Pack
              run: |
                  npm pack
                  mv html2canvas-html2canvas-*.tgz html2canvas.tgz
                  tar --list --verbose --file=html2canvas.tgz
            - name: Upload npm pack
              uses: actions/upload-artifact@v4
              with:
                  name: npm
                  path: html2canvas.tgz
                  if-no-files-found: error
            - name: Upload dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  if-no-files-found: error
            - name: Upload build
              uses: actions/upload-artifact@v4
              with:
                  name: build
                  path: build
                  if-no-files-found: error

    test:
        runs-on: ubuntu-latest
        name: Test
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Cache node modules
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-
            - name: Npm install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Lint
              run: npm run lint
            - name: Unit tests
              run: npm run unittest

    browser-test:
        strategy:
            fail-fast: false
            matrix:
                config:
                    - os: ubuntu-latest
                      name: Linux Firefox Stable
                      targetBrowser: Firefox_Stable
                      xvfb: true
                      # Node 22 is fine on Linux
                      node-version: 22
                    - os: ubuntu-latest
                      name: Linux Chrome Stable
                      targetBrowser: Chrome_Stable
                      xvfb: true
                      node-version: 22
                    - os: macos-latest
                      name: OSX Safari Stable
                      targetBrowser: Safari_Stable
                      xvfb: false
                      # Karma v6 has a known crash (signal wrap assertion) on macOS arm64
                      # regardless of Node version.
                      node-version: 20
        runs-on: ${{ matrix.config.os }}
        name: ${{ matrix.config.name }}
        # Karma v6 has a known crash (SignalWrap assertion) on macOS arm64 runners
        # regardless of Node version. Allow this job to fail without blocking the pipeline.
        continue-on-error: ${{ matrix.config.os == 'macos-latest' }}
        env:
            TARGET_BROWSER: ${{ matrix.config.targetBrowser }}
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.config.node-version }}
            - name: Cache node modules
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-
            - name: Npm install
              run: npm ci
            - name: Download library
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - name: Download test-runner
              uses: actions/download-artifact@v4
              with:
                  name: build
                  path: build
            - name: Run browser tests
              if: ${{ matrix.config.xvfb != true }}
              run: npm run karma
            - name: Start Xvfb
              if: ${{ matrix.config.xvfb == true }}
              run: Xvfb :99 &
            - name: Run browser tests
              if: ${{ matrix.config.xvfb == true }}
              run: DISPLAY=:99 npm run karma
            - name: Upload screenshots
              uses: actions/upload-artifact@v4
              with:
                  name: reftest-results-${{ matrix.config.targetBrowser }}
                  path: tmp/reftests
                  # Screenshots are only produced when tests run; don't fail if missing
                  if-no-files-found: warn

    publish:
        runs-on: ubuntu-latest
        name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        needs: browser-test
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - name: Download NPM package
              uses: actions/download-artifact@v4
              with:
                  name: npm
                  path: npm
            - name: Download library
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - name: Create GitHub Release and upload assets
              uses: softprops/action-gh-release@v2
              with:
                  draft: false
                  prerelease: ${{ contains(github.ref, '-rc.') || contains(github.ref, '-alpha.') }}
                  files: |
                      dist/html2canvas.js
                      dist/html2canvas.min.js
                      dist/html2canvas.esm.js
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Unpack npm
              run: cd npm && tar -xvzf "html2canvas.tgz"
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: 'https://registry.npmjs.org'
            - name: NPM Publish
              run: cd npm/package && npm publish --access public --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    publish-gpr:
        runs-on: ubuntu-latest
        name: Publish Github Package
        if: startsWith(github.ref, 'refs/tags/v')
        needs: browser-test
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@v4
            - name: Download NPM package
              uses: actions/download-artifact@v4
              with:
                  name: npm
                  path: npm
            - name: Download library
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - name: Unpack npm
              run: cd npm && tar -xvzf "html2canvas.tgz"
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://npm.pkg.github.com/
            - run: npm pkg set publishConfig.registry=https://npm.pkg.github.com
            - run: npm publish
              env:
                  NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    docs:
        runs-on: ubuntu-latest
        name: Build docs
        needs: build
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Cache node modules
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-
            - name: Npm install
              run: npm ci
            - name: Download library
              # Must be at dist/ (project root) BEFORE www/npm install so that
              # npm resolves the "html2canvas": "file:../" dependency correctly.
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist
            - name: Copy reftests to docs website
              run: |
                  mkdir -p www/static/tests
                  cp -R tests/reftests www/static/tests/reftests
                  cp -R tests/assets www/static/tests/assets
                  cp tests/test.js www/static/tests/test.js
            - name: Create reftest previewer
              run: npm run build:reftest-preview
            - name: Build docs
              run: cd www && npm install && npm run build && cd ..
            - name: Upload docs
              uses: actions/upload-artifact@v4
              with:
                  name: docs
                  path: www/dist-site
                  if-no-files-found: error

    publish-docs:
        runs-on: ubuntu-latest
        name: Publish Docs
        # Deploy on master push only; releases are handled by deploy-docs.yml
        if: ${{ github.ref == 'refs/heads/master' }}
        needs: docs
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - name: Download docs
              uses: actions/download-artifact@v4
              with:
                  name: docs
                  path: docs
            - name: Publish docs
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: gh-pages
                  FOLDER: docs
                  SINGLE_COMMIT: true
                  CLEAN: true
