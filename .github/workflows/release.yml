name: Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Semantic version (major | minor | patch | premajor | preminor | prepatch | prerelease)'
                default: 'patch'
                required: true

jobs:
    version:
        name: Create version
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history AND all tags are required so that
                  # @release-it/conventional-changelog can find the previous
                  # tag and generate the correct vPREV...vNEW changelog range.
                  # The default shallow clone (fetch-depth: 1) fetches no tags,
                  # which makes every release recompute from an old fixed tag.
                  fetch-depth: 0
                  # Stay on the master branch (not a detached HEAD) so the
                  # release commit and tag land on master and get pushed back.
                  ref: master
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Npm install
              run: npm ci
            - name: Configure git
              run: |
                  git config user.name "CI"
                  git config user.email "zefling@ikilote.net"
            - name: Create release
              # release-it uses the config from .release-it.json (preset
              # "conventionalcommits"). Pass the increment type directly;
              # release-it has no --release-as/--preset flags.
              run: npm run release -- --increment ${{ github.event.inputs.version }} --ci
            - name: Print details
              run: |
                  cat package.json
                  cat CHANGELOG.md
                  git tag
            - name: Push git version
              run: git push --follow-tags origin master
