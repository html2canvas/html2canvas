name: Deploy Docs to GitHub Pages

on:
    release:
        types: [published]

jobs:
    deploy-docs:
        runs-on: ubuntu-latest
        name: Build and deploy Astro docs to gh-pages
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Cache node modules
              uses: actions/cache@v4
              env:
                  cache-name: cache-node-modules
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-build-${{ env.cache-name }}-
                      ${{ runner.os }}-build-
                      ${{ runner.os }}-

            - name: Install root dependencies
              run: npm ci

            - name: Build library
              run: npm run build

            - name: Copy dist to www/static
              run: |
                  mkdir -p www/static/dist
                  cp -R dist/*.js www/static/dist/

            - name: Copy reftests to docs website
              run: |
                  mkdir -p www/static/tests
                  cp -R tests/reftests www/static/tests/reftests
                  cp -R tests/assets www/static/tests/assets
                  cp tests/test.js www/static/tests/test.js

            - name: Create reftest previewer
              run: npm run build:reftest-preview

            - name: Build Astro site
              run: cd www && npm install && npm run build && cd ..

            - name: Deploy to gh-pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BRANCH: gh-pages
                  FOLDER: www/dist-site
                  SINGLE_COMMIT: true
                  CLEAN: true
