<!doctype html>
<html>
  <head>
    <title>Rotation transform tests</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript" src="../../test.js"></script>
    <style>
      .container {
        position: relative;
      }
      .image1 {
        position: absolute;
        left: 100px;
        -webkit-transform: rotate(-45deg);
        transform: rotate(-45deg);
      }
      .image2 {
        position: absolute;
        left: 634px;
        -webkit-transform: rotate(90deg);
        transform: rotate(90deg);
      }
      .image3 {
        position: absolute;
        top: 250px;
        left: 100px;
        -webkit-transform: rotate(45deg);
        transform: rotate(45deg);
      }

      body {
        font-family: Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="image1">
        <img src="../../assets/image.jpg" style="width: 200px; height: 200px" />
      </div>
      <div class="image2">
        <img src="../../assets/image2.jpg" style="width: 50px; height: 200px" />
      </div>
      <div class="image3">
        <img src="../../assets/image.jpg" style="width: 100px; height: 200px" />
      </div>
    </div>
  </body>
</html>
