<!doctype html>
<html>
    <head>
        <title>Skew transform tests</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <script type="text/javascript" src="../../test.js"></script>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #fff;
            }
            .container {
                position: relative;
                height: 130px;
                margin-bottom: 10px;
            }
            .box {
                position: absolute;
                width: 100px;
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 11px;
                color: #fff;
                font-weight: bold;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <!-- skewX -->
        <div class="container">
            <div class="box" style="background: #e74c3c; left: 60px; top: 30px; transform: skewX(15deg);">skewX(15deg)</div>
            <div class="box" style="background: #3498db; left: 230px; top: 30px; transform: skewX(30deg);">skewX(30deg)</div>
            <div class="box" style="background: #2ecc71; left: 400px; top: 30px; transform: skewX(-20deg);">skewX(-20deg)</div>
        </div>

        <!-- skewY -->
        <div class="container">
            <div class="box" style="background: #e67e22; left: 60px; top: 30px; transform: skewY(15deg);">skewY(15deg)</div>
            <div class="box" style="background: #9b59b6; left: 230px; top: 30px; transform: skewY(30deg);">skewY(30deg)</div>
            <div class="box" style="background: #1abc9c; left: 400px; top: 30px; transform: skewY(-20deg);">skewY(-20deg)</div>
        </div>

        <!-- skew(ax, ay) — both axes -->
        <div class="container">
            <div class="box" style="background: #34495e; left: 60px; top: 30px; transform: skew(15deg, 10deg);">skew(15,10)</div>
            <div class="box" style="background: #c0392b; left: 230px; top: 30px; transform: skew(20deg, -15deg);">skew(20,-15)</div>
            <div class="box" style="background: #16a085; left: 400px; top: 30px; transform: skew(-15deg, 15deg);">skew(-15,15)</div>
        </div>

        <!-- skew with text content -->
        <div class="container" style="height: 80px;">
            <p style="position: absolute; left: 60px; top: 10px; transform: skewX(10deg); background: #f39c12; padding: 8px; color: #fff; margin: 0;">
                Skewed paragraph text
            </p>
        </div>
    </body>
</html>
