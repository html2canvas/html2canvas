<!doctype html>
<html>
  <head>
    <title>Background conic-gradient tests</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript" src="../../test.js"></script>
    <style>
      html {
        background-color: red;
      }
      .small div {
        width: 100px;
        height: 100px;
        float: left;
        margin: 10px;
        border: 1px solid #000;
      }
      .medium div {
        width: 210px;
        height: 200px;
        float: left;
        margin: 10px;
        border: 1px solid #000;
      }
      .small,
      .medium {
        clear: both;
      }
      div {
        display: block;
      }

      /* Basic two-color pie */
      .conicGradient1 {
        background: conic-gradient(red, blue);
      }

      /* Named color stops at angles */
      .conicGradient2 {
        background: conic-gradient(red 0deg, yellow 90deg, green 180deg, blue 270deg, red 360deg);
      }

      /* Rotated start angle */
      .conicGradient3 {
        background: conic-gradient(from 45deg, red, blue);
      }

      /* Off-center position */
      .conicGradient4 {
        background: conic-gradient(at 25% 75%, red, yellow, green, blue, red);
      }

      /* from + at combined */
      .conicGradient5 {
        background: conic-gradient(from 90deg at 50% 50%, #f06, #aef, #f06);
      }

      /* Hard-stop color wheel using separate stops */
      .conicGradient6 {
        background: conic-gradient(
          red 0deg,
          red 60deg,
          yellow 60deg,
          yellow 120deg,
          green 120deg,
          green 180deg,
          cyan 180deg,
          cyan 240deg,
          blue 240deg,
          blue 300deg,
          magenta 300deg,
          magenta 360deg
        );
      }

      /* Percentage stops */
      .conicGradient7 {
        background: conic-gradient(#fff 0%, #000 50%, #fff 100%);
      }

      /* Translucent */
      .conicGradient8 {
        background: conic-gradient(rgba(255, 0, 0, 0.9), rgba(0, 255, 0, 0.6), rgba(0, 0, 255, 0.9));
      }

      /* ── New examples ─────────────────────────────────────── */

      /* Double-position hard stops (CSS Images Level 4 shorthand)
         #ccc 0% 25%  ≡  #ccc 0%, #ccc 25% */
      .conicGradient9 {
        background: conic-gradient(#e74c3c 0% 25%, #3498db 25% 50%, #2ecc71 50% 75%, #f39c12 75% 100%);
      }

      /* Double-position — two colors, sharp checkerboard-like split */
      .conicGradient10 {
        background: conic-gradient(#222 0% 50%, #eee 50% 100%);
      }

      /* Stops in turns instead of degrees */
      .conicGradient11 {
        background: conic-gradient(red 0turn, yellow 0.25turn, green 0.5turn, blue 0.75turn, red 1turn);
      }

      /* Stops mixing deg and % */
      .conicGradient12 {
        background: conic-gradient(#f06 0deg, #f06 90deg, #aef 90deg, #aef 180deg, #f39c12 50%, #9b59b6 100%);
      }

      /* from + at + double-position */
      .conicGradient13 {
        background: conic-gradient(from 30deg at 70% 30%, #e74c3c 0% 33%, #3498db 33% 66%, #2ecc71 66% 100%);
      }

      /* oklch color stops */
      .conicGradient14 {
        background: conic-gradient(oklch(62% 0.25 29), oklch(72% 0.2 145), oklch(65% 0.22 260), oklch(62% 0.25 29));
      }

      /* background-size + background-repeat: tile the gradient */
      .conicGradient15 {
        background: conic-gradient(#e74c3c 0% 25%, #fff 25% 50%, #e74c3c 50% 75%, #fff 75% 100%);
        background-size: 50px 50px;
      }

      /* background-position off-center */
      .conicGradient16 {
        background: conic-gradient(from 0deg at 80% 20%, #f39c12, #9b59b6, #f39c12);
      }

      /* Stacked background layers: conic on top of a flat color */
      .conicGradient17 {
        background: conic-gradient(rgba(255, 255, 255, 0.6) 0% 25%, transparent 25%), #3498db;
      }

      /* Many stops — smooth color wheel (12 sectors) */
      .conicGradient18 {
        background: conic-gradient(
          hsl(0, 100%, 50%),
          hsl(30, 100%, 50%),
          hsl(60, 100%, 50%),
          hsl(90, 100%, 50%),
          hsl(120, 100%, 50%),
          hsl(150, 100%, 50%),
          hsl(180, 100%, 50%),
          hsl(210, 100%, 50%),
          hsl(240, 100%, 50%),
          hsl(270, 100%, 50%),
          hsl(300, 100%, 50%),
          hsl(330, 100%, 50%),
          hsl(360, 100%, 50%)
        );
      }
    </style>
  </head>
  <body>
    <div class="small">
      <div class="conicGradient1">&nbsp;</div>
      <div class="conicGradient2">&nbsp;</div>
      <div class="conicGradient3">&nbsp;</div>
      <div class="conicGradient4">&nbsp;</div>
      <div class="conicGradient5">&nbsp;</div>
      <div class="conicGradient6">&nbsp;</div>
      <div class="conicGradient7">&nbsp;</div>
      <div class="conicGradient8">&nbsp;</div>
    </div>
    <div class="small">
      <h3>double-position hard stops</h3>
      <div class="conicGradient9">&nbsp;</div>
      <div class="conicGradient10">&nbsp;</div>
    </div>
    <div class="small">
      <h3>turns, mixed units, from+at+double-pos, oklch</h3>
      <div class="conicGradient11">&nbsp;</div>
      <div class="conicGradient12">&nbsp;</div>
      <div class="conicGradient13">&nbsp;</div>
      <div class="conicGradient14">&nbsp;</div>
    </div>
    <div class="small">
      <h3>background-size tiling, off-center, stacked layers, smooth wheel</h3>
      <div class="conicGradient15">&nbsp;</div>
      <div class="conicGradient16">&nbsp;</div>
      <div class="conicGradient17">&nbsp;</div>
      <div class="conicGradient18">&nbsp;</div>
    </div>
  </body>
</html>
