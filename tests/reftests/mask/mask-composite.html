<!doctype html>
<html>
    <head>
        <title>Mask composite tests</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <script type="text/javascript" src="../../test.js"></script>
        <style type="text/css">
            html { background: #3a84c3; }
            body { margin: 20px; }

            .scene {
                position: relative;
                width: 200px;
                height: 220px;
                display: inline-block;
                margin: 10px;
                vertical-align: top;
            }

            .box {
                width: 200px;
                height: 200px;
                background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff);
            }

            .label {
                position: absolute;
                bottom: 4px;
                left: 0;
                width: 100%;
                text-align: center;
                font: bold 11px/1.3 monospace;
                color: #fff;
                text-shadow: 0 1px 2px rgba(0,0,0,.7);
            }

            /* Two layers: circle (bottom) + left-half stripe (top) */
            /* add: both visible */
            .mask-add {
                mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                -webkit-mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                mask-composite: add;
            }

            /* subtract: top layer cuts hole in bottom */
            .mask-subtract {
                mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                -webkit-mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                mask-composite: subtract;
            }

            /* intersect: only overlap is visible */
            .mask-intersect {
                mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                -webkit-mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                mask-composite: intersect;
            }

            /* exclude: only non-overlapping parts */
            .mask-exclude {
                mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                -webkit-mask-image:
                    linear-gradient(to right, black 50%, transparent 50%),
                    radial-gradient(circle, black 45%, transparent 46%);
                mask-composite: exclude;
            }
        </style>
    </head>
    <body>
        <div class="scene">
            <div class="box mask-add"></div>
            <div class="label">mask-composite: add</div>
        </div>
        <div class="scene">
            <div class="box mask-subtract"></div>
            <div class="label">mask-composite: subtract</div>
        </div>
        <div class="scene">
            <div class="box mask-intersect"></div>
            <div class="label">mask-composite: intersect</div>
        </div>
        <div class="scene">
            <div class="box mask-exclude"></div>
            <div class="label">mask-composite: exclude</div>
        </div>
    </body>
</html>
