<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="/node_modules/mocha/mocha.css" />
        <style>
            /* Hide the code body toggle on passing tests — it's just noise */
            #mocha .test.pass pre {
                display: none !important;
            }
        </style>
        <title>Test runner</title>
    </head>
    <body>
        <div id="mocha"></div>
        <script src="/node_modules/mocha/mocha.js"></script>
        <script>
            mocha.setup({ui: 'bdd', timeout: 30000, diff: false});
        </script>
        <script src="/build/testrunner.js"></script>
        <script>
            mocha.run();
        </script>
    </body>
</html>
